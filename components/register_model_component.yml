$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json

# ─────────────────────────────────────────────────────────────────────────────
# Component 3: Model Registration
# Registers model artifact in AML Model Registry + logs to MLflow
# ─────────────────────────────────────────────────────────────────────────────
name: register_model_component
version: 2
display_name: "Model Registration"
type: command
description: >
  Reads the model artifact folder (model.joblib + model_metadata.json),
  registers it in the Azure ML Model Registry with rich metadata tags
  (MAE, RMSE, R²), and logs registration details back to MLflow.

code: ../pipeline_components

environment: azureml:pricing-env:1

command: >-
  python register_model.py
  --model_path ${{inputs.model_path}}
  --model_name used_cars_pricing_model

inputs:
  model_path:
    type: uri_folder
    description: "Folder containing model.joblib and model_metadata.json"
