$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json

# ─────────────────────────────────────────────────────────────────────────────
# Component 2: Model Training & Hyperparameter Tuning
# Optuna search + MLflow nested run logging + final model save
# ─────────────────────────────────────────────────────────────────────────────
name: train_tune_component
version: 3
display_name: "Model Training & Tuning (MLflow)"
type: command
description: >
  Loads processed CSV, runs Optuna hyperparameter search (n_trials trials),
  logs each trial as a nested MLflow run, trains a final GradientBoosting
  model with best params, and registers it in the MLflow Model Registry.

code: ../pipeline_components

environment: azureml:pricing-env:2

command: >-
  python train_tune.py
  --processed_data  ${{inputs.processed_data}}
  --model_folder    ${{outputs.model_folder}}
  --experiment_name pricing_experiment
  --trials          20

inputs:
  processed_data:
    type: uri_folder
    description: "Folder containing processed_data.csv from preprocess component"

outputs:
  model_folder:
    type: uri_folder
    description: "Folder containing model.joblib and model_metadata.json"
