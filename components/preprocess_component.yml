$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json

# ─────────────────────────────────────────────────────────────────────────────
# Component 1: Data Preprocessing
# Cleans raw CSV, engineers features, logs stats to MLflow
# ─────────────────────────────────────────────────────────────────────────────
name: preprocess_component
version: 3
display_name: "Data Preprocessing"
type: command
description: >
  Reads raw used-car CSV, strips units from numeric columns, drops nulls,
  engineers power_per_cc / log_price / Segment_enc features, and logs
  dataset statistics to MLflow.

# Points to the folder containing preprocess.py (and the other .py files)
code: ../pipeline_components

environment: azureml:pricing-env:2

command: >-
  python preprocess.py
  --input_data  ${{inputs.input_data}}
  --output_data ${{outputs.output_data}}

inputs:
  input_data:
    type: uri_file
    description: "Raw input CSV file (used_cars.csv)"

outputs:
  output_data:
    type: uri_folder
    description: "Folder containing processed_data.csv"
