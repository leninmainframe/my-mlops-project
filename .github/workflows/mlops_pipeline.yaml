name: Run MLOps Pipeline on Azure ML

on:
  workflow_dispatch:

jobs:
  run-azureml-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Azure ML SDK
      run: |
        pip install azure-ai-ml azure-identity

    - name: Run Azure ML Job
      env:
        SUBSCRIPTION_ID: ${{ secrets.AZ_SUBSCRIPTION_ID }}
        RESOURCE_GROUP: ${{ secrets.AZ_RESOURCE_GROUP }}
        WORKSPACE_NAME: ${{ secrets.AZ_WORKSPACE_NAME }}
      run: |
        python scripts/run_pipeline.py
