name: Run MLOps Pipeline on Azure ML

on:
  workflow_dispatch:

permissions:
  contents: read # OIDC 'id-token: write' is no longer required

jobs:
  run-azureml-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: DEBUG — Check env/secrets
        run: |
          echo "AZURE_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          echo "AZ_RESOURCE_GROUP=${{ secrets.AZ_RESOURCE_GROUP }}"
          echo "AZ_WORKSPACE=${{ secrets.AZ_WORKSPACE }}"
          echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}"
          echo "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}"
          # NOTE: Client Secret value will not be echoed for security reasons.

      # REMOVED: The 'Azure Login (OIDC)' step is removed since we use ClientSecretCredential now.

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Azure ML SDK
        run: |
          python -m pip install --upgrade pip
          pip install azure-ai-ml azure-identity

      # ⭐ NEW STEP: Register components - This step uploads your component definitions to Azure ML.
      - name: Register Azure ML Components
        env:
          # Pass ALL secrets for ClientSecretCredential authentication
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZ_RESOURCE_GROUP: ${{ secrets.AZ_RESOURCE_GROUP }}
          AZ_WORKSPACE: ${{ secrets.AZ_WORKSPACE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }} 
        run: |
          python scripts/register_components.py

      - name: Execute Azure ML Pipeline
        env:
          # Pass ALL secrets to the pipeline execution script
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZ_RESOURCE_GROUP: ${{ secrets.AZ_RESOURCE_GROUP }}
          AZ_WORKSPACE: ${{ secrets.AZ_WORKSPACE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }} 
        run: |
          python scripts/run_pipeline.py
