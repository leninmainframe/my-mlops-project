# ─────────────────────────────────────────────────────────────────────────────
# Azure ML MLOps CI/CD — Single Pipeline Workflow (FIXED VERSION)
# ─────────────────────────────────────────────────────────────────────────────

name: "Azure ML MLOps Pipeline"

on:
  push:
    branches: [main, develop]
    paths:
      - "pipeline_components/**"
      - "components/**"
      - "scripts/**"
      - "environment.yaml"
      - "requirements.txt"
      - "used_cars.csv"
      - ".github/workflows/mlops_pipeline.yml"

  workflow_dispatch:
    inputs:
      skip_upload:
        description: "Skip dataset upload?"
        required: false
        default: "0"
      compute:
        description: "Override compute cluster"
        required: false
        default: ""
      data_path:
        description: "Override data URI"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID:       ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID:       ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET:   ${{ secrets.AZURE_CLIENT_SECRET }}
  AZ_RESOURCE_GROUP:     ${{ secrets.AZ_RESOURCE_GROUP }}
  AZ_WORKSPACE:          ${{ secrets.AZ_WORKSPACE }}
  PYTHON_VERSION:        "3.10"

jobs:
  mlops-pipeline:
    name: "🚀 Azure ML MLOps — Full Pipeline Run"
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      # ── 2. Validate secrets ────────────────────────────────────────────────
      - name: "🔑 Validate GitHub Secrets"
        run: |
          MISSING=0
          for SECRET in \
            AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID \
            AZURE_SUBSCRIPTION_ID AZ_RESOURCE_GROUP AZ_WORKSPACE AZ_COMPUTE; do
            if [ -z "$(printenv "$SECRET")" ]; then
              echo "❌ MISSING: $SECRET"
              MISSING=$((MISSING + 1))
            else
              echo "✅ OK: $SECRET"
            fi
          done

          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING secret(s) missing"
            exit 1
          fi
        env:
          AZ_COMPUTE: ${{ secrets.AZ_COMPUTE }}

      # ── 3. Azure Login ─────────────────────────────────────────────────────
      - name: "🔐 Azure Login"
        uses: azure/login@v2
        with:
          creds: >-
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      # ── 4. Setup Python ────────────────────────────────────────────────────
      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      # ── 5. Install dependencies ────────────────────────────────────────────
      - name: "📦 Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 6. Run Azure ML Pipeline ───────────────────────────────────────────
      - name: "⚙️ Run Full MLOps Pipeline"
        id: run_pipeline
        env:
          COMPUTE: >-
            ${{
              github.event.inputs.compute != '' &&
              github.event.inputs.compute ||
              secrets.AZ_COMPUTE
            }}
          SKIP_UPLOAD: ${{ github.event.inputs.skip_upload || '0' }}
          DATA_PATH: ${{ github.event.inputs.data_path || '' }}

        run: |
          python scripts/run_pipeline_all.py | tee pipeline_output.txt

          JOB_NAME=$(grep "Job name" pipeline_output.txt | awk '{print $NF}' || echo "N/A")
          STUDIO_URL=$(grep "Studio URL" pipeline_output.txt | awk '{print $NF}' || echo "")

          echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"
          echo "studio_url=$STUDIO_URL" >> "$GITHUB_OUTPUT"

      # ── 7. Job Summary ─────────────────────────────────────────────────────
      - name: "📋 Write Job Summary"
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## 🚗 Azure ML MLOps Pipeline

          **Status:** ${{ steps.run_pipeline.outcome }}

          **AML Job:** ${{ steps.run_pipeline.outputs.job_name }}

          $( [ -n "${{ steps.run_pipeline.outputs.studio_url }}" ] && \
            echo "🔗 [Open in Azure ML Studio](${{ steps.run_pipeline.outputs.studio_url }})" )

          ---
          Run #${{ github.run_number }}
          SUMMARY
