name: Run MLOps Pipeline on Azure ML

on:
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  run-azureml-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: DEBUG — Check env/secrets
        run: |
          echo "AZURE_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          echo "AZ_RESOURCE_GROUP=${{ secrets.AZ_RESOURCE_GROUP }}"
          echo "AZ_WORKSPACE=${{ secrets.AZ_WORKSPACE }}"

      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}        # service principal app id
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}        # tenant id
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Azure ML SDK
        run: |
          python -m pip install --upgrade pip
          pip install azure-ai-ml azure-identity

      - name: Execute Azure ML Pipeline
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZ_RESOURCE_GROUP: ${{ secrets.AZ_RESOURCE_GROUP }}
          AZ_WORKSPACE: ${{ secrets.AZ_WORKSPACE }}
        run: |
          python scripts/run_pipeline.py
