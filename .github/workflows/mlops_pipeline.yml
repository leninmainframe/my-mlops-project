# .github/workflows/mlops_pipeline.yml
# Copy-paste this file into .github/workflows/mlops_pipeline.yml in your repo
name: Run MLOps Pipeline on Azure ML

on:
  workflow_dispatch:

permissions:
  # Required for OIDC authentication via azure/login@v1
  id-token: write
  contents: read

jobs:
  run-azureml-pipeline:
    name: Run Azure ML pipeline
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: DEBUG — Check Secret Availability
        run: |
          echo "===== SECRET CHECK START ====="
          test -n "${{ secrets.AZURE_CLIENT_ID }}" && echo "AZURE_CLIENT_ID = OK" || echo "AZURE_CLIENT_ID = EMPTY"
          test -n "${{ secrets.AZURE_TENANT_ID }}" && echo "AZURE_TENANT_ID = OK" || echo "AZURE_TENANT_ID = EMPTY"
          test -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" && echo "AZURE_SUBSCRIPTION_ID = OK" || echo "AZURE_SUBSCRIPTION_ID = EMPTY"
          test -n "${{ secrets.AZ_RESOURCE_GROUP }}" && echo "AZ_RESOURCE_GROUP = OK" || echo "AZ_RESOURCE_GROUP = EMPTY"
          test -n "${{ secrets.AZ_WORKSPACE }}" && echo "AZ_WORKSPACE = OK" || echo "AZ_WORKSPACE = EMPTY"
          echo "===== SECRET CHECK END ====="

      # Authenticate using OIDC (sets up DefaultAzureCredential for Azure SDKs)
      - name: Azure Login (OIDC)
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: false

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install azure-ai-ml azure-identity pyyaml

      # Register Azure ML Environment
      - name: Register Azure ML Environment
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZ_RESOURCE_GROUP: ${{ secrets.AZ_RESOURCE_GROUP }}
          AZ_WORKSPACE: ${{ secrets.AZ_WORKSPACE }}
        run: |
          echo "Running scripts/register_environment.py"
          python scripts/register_environment.py

      # Register Azure ML Components
      - name: Register Azure ML Components
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZ_RESOURCE_GROUP: ${{ secrets.AZ_RESOURCE_GROUP }}
          AZ_WORKSPACE: ${{ secrets.AZ_WORKSPACE }}
        run: |
          echo "Running scripts/register_components.py"
          python scripts/register_components.py

      # Execute the pipeline
      - name: Execute Azure ML Pipeline
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZ_RESOURCE_GROUP: ${{ secrets.AZ_RESOURCE_GROUP }}
          AZ_WORKSPACE: ${{ secrets.AZ_WORKSPACE }}
          # Add any other secrets you need here, e.g.:
          # AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          echo "Executing pipeline script"
          # Ensure you have a script that triggers/publishes your pipeline (adjust filename if necessary)
          if [ -f scripts/execute_pipeline.py ]; then
            python scripts/execute_pipeline.py
          else
            echo "scripts/execute_pipeline.py not found — please add a script that triggers your Azure ML pipeline"
            exit 1
          fi
