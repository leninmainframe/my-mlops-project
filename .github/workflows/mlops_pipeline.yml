# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/mlops_pipeline.yml
#
# Azure ML MLOps CI/CD Pipeline
# ─────────────────────────────────────────────────────────────────────────────
#
# TRIGGERS
# ─────────
#   • push to main or develop (auto CICD)
#   • manual run via GitHub Actions UI (workflow_dispatch)
#
# WHAT IT DOES
# ─────────────
#   1. Checkout code
#   2. Authenticate to Azure using a Service Principal (client-secret)
#   3. Install Python dependencies
#   4. Register the Azure ML Environment  (pricing-env)
#   5. Register all pipeline Components  (preprocess / train / register)
#   6. Submit the end-to-end pipeline job on Azure ML
#
# REQUIRED GITHUB SECRETS  (Settings → Secrets → Actions)
# ──────────────────────────────────────────────────────────
#   AZURE_CLIENT_ID         Service Principal Application (client) ID
#   AZURE_CLIENT_SECRET     Service Principal secret value
#   AZURE_TENANT_ID         Azure AD tenant ID
#   AZURE_SUBSCRIPTION_ID   Azure subscription ID
#   AZ_RESOURCE_GROUP       Resource group containing the AML workspace
#   AZ_WORKSPACE            Azure ML workspace name
#   AZ_COMPUTE              Compute cluster name (e.g. ml-cluster)
# ─────────────────────────────────────────────────────────────────────────────

name: "Azure ML MLOps Pipeline"

on:
  push:
    branches:
      - main
      - develop
    paths:                        # Only trigger when relevant code changes
      - "pipeline_components/**"
      - "components/**"
      - "scripts/**"
      - "environment.yaml"
      - ".github/workflows/mlops_pipeline.yml"

  workflow_dispatch:              # Allow manual trigger from the GitHub UI
    inputs:
      trials:
        description: "Number of Optuna tuning trials"
        required: false
        default: "20"

permissions:
  contents: read                  # Checkout code
  id-token: write                 # Required for OIDC (if switching to federated auth)

# Cancel in-progress runs on the same branch to avoid queue buildup
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB: run-mlops-pipeline
  # ─────────────────────────────────────────────────────────────────────────
  run-mlops-pipeline:
    name: "Run Azure ML Pipeline"
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Checkout ─────────────────────────────────────────────────
      - name: "Checkout repository"
        uses: actions/checkout@v4

      # ── Step 2: Verify secrets are present ───────────────────────────────
      - name: "Validate secrets"
        run: |
          echo "===== Checking required secrets ====="
          MISSING=0
          for SECRET_NAME in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID \
                             AZURE_SUBSCRIPTION_ID AZ_RESOURCE_GROUP AZ_WORKSPACE AZ_COMPUTE; do
            VAL=$(printenv $SECRET_NAME || true)
            if [ -z "$VAL" ]; then
              echo "  ❌ MISSING: $SECRET_NAME"
              MISSING=$((MISSING+1))
            else
              echo "  ✅ OK:      $SECRET_NAME"
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "ERROR: $MISSING secret(s) are missing. Add them under Settings → Secrets → Actions."
            exit 1
          fi
          echo "====================================="
        env:
          AZURE_CLIENT_ID:        ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:    ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID:        ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID:  ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZ_RESOURCE_GROUP:      ${{ secrets.AZ_RESOURCE_GROUP }}
          AZ_WORKSPACE:           ${{ secrets.AZ_WORKSPACE }}
          AZ_COMPUTE:             ${{ secrets.AZ_COMPUTE }}

      # ── Step 3: Azure Login (Service Principal) ───────────────────────────
      - name: "Azure Login"
        uses: azure/login@v1
        with:
          creds: >-
            {
              "clientId":       "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret":   "${{ secrets.AZURE_CLIENT_SECRET }}",
              "tenantId":       "${{ secrets.AZURE_TENANT_ID }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
            }

      # ── Step 4: Setup Python ─────────────────────────────────────────────
      - name: "Setup Python 3.10"
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # ── Step 5: Install Python dependencies ──────────────────────────────
      - name: "Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install azure-ai-ml azure-identity pyyaml

      # ── Step 6: Register Azure ML Environment ────────────────────────────
      - name: "Register Azure ML Environment"
        env:
          AZURE_SUBSCRIPTION_ID:  ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID:        ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:        ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:    ${{ secrets.AZURE_CLIENT_SECRET }}
          AZ_RESOURCE_GROUP:      ${{ secrets.AZ_RESOURCE_GROUP }}
          AZ_WORKSPACE:           ${{ secrets.AZ_WORKSPACE }}
        run: |
          echo "─── Registering Azure ML Environment ───"
          python scripts/register_environment.py

      # ── Step 7: Register Pipeline Components ─────────────────────────────
      - name: "Register Pipeline Components"
        env:
          AZURE_SUBSCRIPTION_ID:  ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID:        ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:        ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:    ${{ secrets.AZURE_CLIENT_SECRET }}
          AZ_RESOURCE_GROUP:      ${{ secrets.AZ_RESOURCE_GROUP }}
          AZ_WORKSPACE:           ${{ secrets.AZ_WORKSPACE }}
        run: |
          echo "─── Registering Pipeline Components ───"
          python scripts/register_components.py

      # ── Step 8: Execute Pipeline ──────────────────────────────────────────
      - name: "Execute Azure ML Pipeline"
        env:
          AZURE_SUBSCRIPTION_ID:  ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID:        ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID:        ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET:    ${{ secrets.AZURE_CLIENT_SECRET }}
          AZ_RESOURCE_GROUP:      ${{ secrets.AZ_RESOURCE_GROUP }}
          AZ_WORKSPACE:           ${{ secrets.AZ_WORKSPACE }}
          COMPUTE:                ${{ secrets.AZ_COMPUTE }}
        run: |
          echo "─── Executing Azure ML Pipeline ───"
          python scripts/execute_pipeline.py
